---
layout: default
---
<article class="reading-page">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
  <header class="article-header">
    <p class="eyebrow">Research notes · {{ page.date | date: '%B %-d, %Y' }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.summary %}<p class="article-summary">{{ page.summary | escape }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <div class="article-end"><a href="{{ '/blog/' | relative_url }}">← More writing</a></div>
</article>
