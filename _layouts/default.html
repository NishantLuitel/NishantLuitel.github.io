<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111418">
    <meta name="description" content="{{ page.summary | default: site.description | escape }}">
    <title>{% if page.home %}{{ site.title | escape }}{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}">
    {% if page.blog %}
    <script>
      window.MathJax = {tex: {inlineMath: {'[+]': [['$', '$']]}}};
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Nishant Luitel, home">NL<span class="wordmark-dot">.</span></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/#research' | relative_url }}">Research</a>
          <a href="{{ '/#publications' | relative_url }}">Publications</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
        </nav>
      </header>

      <main id="main-content">
        {% if page.home %}
        <section class="hero" aria-labelledby="page-title">
          <div class="hero-copy">
            <p class="eyebrow">Hello, I'm</p>
            <h1 id="page-title">{{ page.title | escape }}</h1>
            <p class="role">{{ page.role | escape }}</p>
          </div>
          <img class="portrait" src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Portrait of Nishant Luitel" width="192" height="192">
        </section>

        <article class="content home-content">
          {{ content }}
        </article>
        {% else %}
        {{ content }}
        {% endif %}
      </main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} Nishant Luitel</span>
        <a href="#main-content">Back to top ↑</a>
      </footer>
    </div>
  </body>
</html>
